name: sync-sub

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch upstream and rewrite sub_plain.txt
        env:
          UPSTREAM_URL: ${{ secrets.UPSTREAM_URL }}
          SUB_HWID: ${{ secrets.SUB_HWID }}
        run: python3 sync_sub.py
      - name: Commit if changed
        run: |
          git config user.name "sub-sync-bot"
          git config user.email "sub-sync-bot@users.noreply.github.com"
          git add sub_plain.txt
          git diff --cached --quiet && echo "no changes" || (git commit -m "sync sub $(date -u +%FT%TZ)" && git push)
